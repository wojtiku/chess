<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" width="45" height="45" role="img" aria-label="White knight">
  <defs>
    <!-- `userSpaceOnUse` is the whole point. The default, `objectBoundingBox`,
         gives every SHAPE its own gradient relative to its own bounding box, so a
         rook's crenellations and its base would each be fully shaded and the piece
         would band into separate objects. In user space one gradient spans the
         45x45 viewBox, so the light falls across the whole silhouette at once. -->
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="42">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.42" stop-color="#f4ecdb"/>
      <stop offset="1" stop-color="#d9cbae"/>
    </linearGradient>
  </defs>
  <title>White knight</title>
